
name: MH Tour - Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Ambil kode dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Siapkan Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Siapkan Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Periksa struktur proyek
      - name: Check Android project
        run: |
          test -f ./gradlew || {
            echo "ERROR: gradlew tidak ditemukan di root proyek"
            exit 1
          }

          test -f ./settings.gradle || \
          test -f ./settings.gradle.kts || {
            echo "ERROR: settings.gradle(.kts) tidak ditemukan"
            exit 1
          }

          test -f ./app/build.gradle || \
          test -f ./app/build.gradle.kts || {
            echo "ERROR: build.gradle(.kts) modul app tidak ditemukan"
            exit 1
          }

      # 5. Aktifkan Gradle Wrapper
      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      # 6. Build APK release
      - name: Build Release APK
        run: ./gradlew --no-daemon clean assembleRelease

      # 7. Pastikan APK berhasil dibuat
      - name: Verify APK
        run: |
          APK_DIR="app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Folder APK release tidak ditemukan"
            exit 1
          fi

          find "$APK_DIR" -type f -name "*.apk" -print

          if ! find "$APK_DIR" -type f -name "*.apk" | grep -q .; then
            echo "ERROR: APK tidak berhasil dibuat"
            exit 1
          fi

      # 8. Unggah APK agar dapat diunduh
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MH-Tour-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
